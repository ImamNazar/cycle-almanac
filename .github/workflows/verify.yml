name: Verify Cycle Almanac
on:
  push:
    branches: [main, fix/data-integrity-audit-20261118, design/almanac-2-prototype, rebuild/almanac-lively-inspired]
  pull_request:
    branches: [main]
jobs:
  engine-tests:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check JavaScript syntax
        run: |
          for file in assets/js/*.js sw.js tests/*.js tests/*.cjs; do node --check "$file"; done
      - name: Run cycle engine tests
        run: node tests/engine.test.js
      - name: Run community page regression tests
        run: node tests/community-render.cjs
      - name: Install Chromium test runner
        run: |
          npm install --no-save playwright@1.56.1
          # Chromium does not require the runner's optional Microsoft apt feed.
          for source in /etc/apt/sources.list.d/*; do
            if [ -f "$source" ] && grep -q 'packages.microsoft.com' "$source"; then
              sudo mv "$source" "$source.disabled"
            fi
          done
          npx playwright install --with-deps chromium
      - name: Run browser smoke tests (mobile and desktop)
        run: node tests/browser.test.js
      - name: Capture Studio visual acceptance screenshots
        run: node tests/studio-visual.cjs
      - name: Upload Studio screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: studio-screenshots
          path: studio-screenshots/
          if-no-files-found: warn
