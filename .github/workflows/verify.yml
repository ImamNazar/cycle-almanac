name: Verify Cycle Almanac
on:
  push:
    branches: [main, fix/data-integrity-audit-20261118, design/almanac-2-prototype]
  pull_request:
    branches: [main]
jobs:
  engine-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check JavaScript syntax
        run: |
          for file in assets/js/*.js sw.js tests/*.js; do node --check "$file"; done
      - name: Run cycle engine tests
        run: node tests/engine.test.js
      - name: Install Chromium test runner
        run: |
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Run browser smoke tests (mobile and desktop)
        run: node tests/browser.test.js
